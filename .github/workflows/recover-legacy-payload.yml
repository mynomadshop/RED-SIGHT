name: Recover legacy installer payload

# One-shot recovery job: unpacks the shipped RedSight-Setup-11.2.0.exe on a real
# Windows runner so the 11.2.0 application tree and its first-run setup scripts
# can be used as the base for the rebuilt installer.
#
# Inno Setup 6.7 installers cannot be unpacked by any released third-party tool,
# so the authoritative way to read the payload is to let the installer itself
# extract it on Windows.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-legacy-payload.yml'
      - 'installer/legacy/*.exe'

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        shell: pwsh
        run: |
          Write-Host "OS       : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PWSH     : $($PSVersionTable.PSVersion)"
          Write-Host "Installer: $((Get-Item installer/legacy/RedSight-Setup-11.2.0.exe).Length) bytes"
          Get-FileHash installer/legacy/RedSight-Setup-11.2.0.exe -Algorithm SHA256 | Format-List

      # Best effort: innounp can recover the original install_script.iss, which is
      # far more useful than the extracted files alone. It may not understand 6.7.
      - name: Try innounp (recovers install_script.iss)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innounp -y --no-progress 2>&1 | Select-Object -Last 15
          $unp = Get-ChildItem -Path 'C:\ProgramData\chocolatey' -Filter 'innounp.exe' -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $unp) { Write-Host 'innounp not found'; exit 0 }
          Write-Host "innounp: $unp"
          New-Item -ItemType Directory -Force -Path unp | Out-Null
          & $unp -x -y -dunp installer/legacy/RedSight-Setup-11.2.0.exe 2>&1 | Select-Object -Last 40
          Write-Host "exit=$LASTEXITCODE"
          if (Test-Path 'unp\install_script.iss') {
            Write-Host '=== install_script.iss recovered ==='
            New-Item -ItemType Directory -Force -Path installer/recovered | Out-Null
            Copy-Item 'unp\install_script.iss' 'installer/recovered/install_script.iss' -Force
          }

      # Authoritative extraction: run the real installer silently.
      # Python is deliberately kept off PATH so the installer's own first-run
      # bootstrap bails out immediately instead of building venvs for 20 minutes;
      # the files are already laid down by the time [Run] executes.
      - name: Extract payload via silent install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = 'C:\rs-extract'
          $exe  = (Resolve-Path installer/legacy/RedSight-Setup-11.2.0.exe).Path
          $log  = 'C:\rs-install.log'

          # Minimal PATH: no Python, no Node, no Docker.
          $minimal = 'C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0'
          $saved = $env:PATH
          $env:PATH = $minimal

          $setupArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL',
                    "/DIR=$dest", '/NOICONS', '/TASKS=', "/LOG=$log")
          Write-Host "Running: $exe $($setupArgs -join ' ')"
          $p = Start-Process -FilePath $exe -ArgumentList $setupArgs -PassThru
          if (-not $p.WaitForExit(900000)) {
            Write-Host 'Installer still running after 15m - killing (files are already extracted).'
            try { $p.Kill($true) } catch { }
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          $env:PATH = $saved

          if (Test-Path $log) {
            Write-Host '=== install log (tail) ==='
            Get-Content $log -Tail 60
          }

          if (-not (Test-Path $dest)) { throw "extraction failed: $dest does not exist" }
          $files = Get-ChildItem -Path $dest -Recurse -File
          Write-Host "extracted files: $($files.Count)"
          Write-Host "extracted bytes: $(($files | Measure-Object Length -Sum).Sum)"

      - name: Build manifest and collect installer-relevant sources
        shell: pwsh
        run: |
          $dest = 'C:\rs-extract'
          $out  = 'installer/recovered'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Full inventory: path, size, sha256 - lets the rebuild be verified
          # against the shipped 11.2.0 payload file by file.
          Get-ChildItem -Path $dest -Recurse -File |
            ForEach-Object {
              $rel = $_.FullName.Substring($dest.Length + 1)
              [pscustomobject]@{
                path   = $rel -replace '\\','/'
                size   = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            } | Sort-Object path | ConvertTo-Json -Depth 3 |
            Set-Content "$out/payload-manifest-11.2.0.json" -Encoding utf8

          # The setup/launcher scripts we need to read and improve.
          $want = @(
            'scripts/windows/Bootstrap-RedSight.ps1',
            'scripts/windows/Install-RedSightDesktopShortcut.ps1',
            'scripts/windows/Uninstall-RedSightDocker.ps1',
            'LAUNCH-REDSIGHT-DESKTOP.ps1',
            'LAUNCH-REDSIGHT-COMMAND-CENTER.ps1',
            'START-REDSIGHT.ps1',
            'requirements-desktop-stage11.txt',
            'requirements-stage111-actions.txt',
            'requirements.txt',
            'pyproject.toml',
            'docker-compose.yml',
            'docker-compose.override.yml',
            'Dockerfile',
            'Dockerfile.qdrant',
            '.env.example',
            'docs/WINDOWS-LAUNCHER.md'
          )
          New-Item -ItemType Directory -Force -Path "$out/tree" | Out-Null
          foreach ($w in $want) {
            $src = Join-Path $dest ($w -replace '/','\')
            if (Test-Path $src) {
              $dst = Join-Path "$out/tree" ($w -replace '/','\')
              New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
              Copy-Item $src $dst -Force
              Write-Host "collected: $w"
            } else {
              Write-Host "MISSING  : $w"
            }
          }

          # Directory-level summary so the payload shape is reviewable in-repo.
          Get-ChildItem -Path $dest -Recurse -File |
            ForEach-Object { ($_.FullName.Substring($dest.Length + 1) -replace '\\','/') } |
            ForEach-Object { if ($_ -match '/') { ($_ -split '/')[0] } else { '<root>' } } |
            Group-Object | Sort-Object Count -Descending |
            ForEach-Object { "{0,7}  {1}" -f $_.Count, $_.Name } |
            Set-Content "$out/payload-tree-summary.txt" -Encoding utf8

          Get-Content "$out/payload-tree-summary.txt"

      - name: Upload full extracted payload
        uses: actions/upload-artifact@v4
        with:
          name: redsight-11.2.0-payload
          path: C:\rs-extract
          retention-days: 7
          if-no-files-found: error

      - name: Commit recovered sources
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add installer/recovered
          $changed = git status --porcelain installer/recovered
          if (-not $changed) { Write-Host 'nothing to commit'; exit 0 }
          git commit -m "Recover 11.2.0 installer payload manifest and setup scripts [skip ci]"
          for ($i = 0; $i -lt 5; $i++) {
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -eq 0) { Write-Host 'pushed'; exit 0 }
            Start-Sleep -Seconds ([math]::Pow(2, $i + 1))
            git pull --rebase origin ${{ github.ref_name }}
          }
          throw 'push failed'
