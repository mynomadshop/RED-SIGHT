name: RedSight Windows v6 Build

# The v6 bundle is built by the one Windows pipeline this repository has:
# build-windows-installer.yml. This workflow is a named entry point for it, kept
# so "RedSight Windows v6 Build" stays runnable from the Actions tab.
#
# It used to be a second, self-contained pipeline that compiled its own .iss
# under a different AppId. Two AppIds meant Windows treated the two builds as
# unrelated products: both could be installed at once, each with its own
# uninstall entry, and they then fought over ports 8000/8765 and over
# %LOCALAPPDATA%\RedSight. It also had no install test, so nothing it produced
# was ever run before being published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 11.6.0)'
        type: string
        required: false
        default: '11.6.0'
      include_all_wheels:
        description: 'Bundle every Python wheel for a fully offline installer (adds ~1 GB)'
        type: boolean
        required: false
        default: false
      create_release:
        description: 'Publish the zip as a GitHub Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      version: ${{ inputs.version }}
      include_all_wheels: ${{ inputs.include_all_wheels }}
      create_release: ${{ inputs.create_release }}
    secrets: inherit
