
services:
  redsight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redsight
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - redsight-data:/data
    environment:
      # The Windows installer rewrites these compatibility aliases. The typed
      # settings layer maps them to the canonical nested configuration.
      - RED_SIGHT_MODE=local_preferred
      - RED_SIGHT_DATA_ROOT=/data
      - LM_STUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - QDRANT_URL=http://qdrant:6333
      - LOG_LEVEL=INFO
      # Shared by the desktop/gateway and container API. The installer launcher
      # creates a random per-user value before invoking docker compose.
      - REDSIGHT_LOCAL_API_TOKEN=${REDSIGHT_LOCAL_API_TOKEN:?local API token is required}
      - REDSIGHT_ACTIVE_PROVIDER=${REDSIGHT_ACTIVE_PROVIDER:-}
      - REDSIGHT_PROVIDER_MODEL=${REDSIGHT_PROVIDER_MODEL:-}
      - RED_SIGHT_PLATFORM__MODE=${RED_SIGHT_PLATFORM__MODE:-local_preferred}
      - RED_SIGHT_ROUTING__CLOUD_FALLBACK=${RED_SIGHT_ROUTING__CLOUD_FALLBACK:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - REDSIGHT_CUSTOM_API_KEY=${REDSIGHT_CUSTOM_API_KEY:-}
      - REDSIGHT_OPENAI_BASE_URL=${REDSIGHT_OPENAI_BASE_URL:-}
      - REDSIGHT_ANTHROPIC_BASE_URL=${REDSIGHT_ANTHROPIC_BASE_URL:-}
      - REDSIGHT_GEMINI_BASE_URL=${REDSIGHT_GEMINI_BASE_URL:-}
      - REDSIGHT_XAI_BASE_URL=${REDSIGHT_XAI_BASE_URL:-}
      - REDSIGHT_OPENROUTER_BASE_URL=${REDSIGHT_OPENROUTER_BASE_URL:-}
      - REDSIGHT_GROQ_BASE_URL=${REDSIGHT_GROQ_BASE_URL:-}
      - REDSIGHT_MISTRAL_BASE_URL=${REDSIGHT_MISTRAL_BASE_URL:-}
      - REDSIGHT_TOGETHER_BASE_URL=${REDSIGHT_TOGETHER_BASE_URL:-}
      - REDSIGHT_DEEPSEEK_BASE_URL=${REDSIGHT_DEEPSEEK_BASE_URL:-}
      - REDSIGHT_CEREBRAS_BASE_URL=${REDSIGHT_CEREBRAS_BASE_URL:-}
      - REDSIGHT_CUSTOM_BASE_URL=${REDSIGHT_CUSTOM_BASE_URL:-}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: redsight-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redsight-data:
  qdrant-data:
