[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redsight"
version = "11.6.0"
description = "High-Performance Local AI Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Wali Mohsin", email = "wali@redsight.ai"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "python-multipart>=0.0.20",
    "openai>=1.58.0",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "onnxruntime>=1.20.0",
    "qdrant-client>=1.12.0,<2",
    "sqlalchemy>=2.0.36,<3",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "nvidia-ml-py>=13.610.43",
    "PySide6>=6.8.0,<7",
    "qasync>=0.28.0,<1",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0,<4",
    "python-pptx>=1.0.0,<2",
    "markdown>=3.7.0",
    "chardet>=5.2.0",
    "httpx>=0.28.0,<1",
    "playwright>=1.49.0",
    "reportlab>=4.2.5",
    "tzlocal>=5.2",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx2>=2.12.0,<3",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
tensorrt = [
    "tensorrt>=10.0.0",
    "tensorrt-llm>=0.15.0",
]

[project.scripts]
redsight = "redsight.cli:main"
redsight-server = "redsight.server:main"
redsight-ui = "redsight.ui:main"
redsight-index = "scripts.index:main"
redsight-benchmark = "scripts.benchmark:main"

[tool.setuptools.packages.find]
include = ["app*", "redsight*", "redsight_actions*", "ui*", "scripts*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "redsight", "redsight_actions", "ui", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["app", "redsight", "redsight_actions", "ui"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
