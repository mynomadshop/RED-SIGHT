[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redsight"
version = "0.1.0"
description = "High-Performance Local AI Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Wali Mohsin", email = "wali@redsight.ai"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",

    # AI/ML
    "openai>=1.58.0",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "onnxruntime>=1.20.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # Database / scheduling
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",

    # GPU
    "pynvml>=11.5.0",

    # UI
    "PySide6>=6.8.0",

    # Ingestion
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.7.0",
    "chardet>=5.2.0",

    # Web / browser automation
    "httpx>=0.28.0",
    "playwright>=1.49.0",

    # Reporting / timezone support used by the action gateway
    "reportlab>=4.2.5",
    "tzlocal>=5.2",

    # Tools / runtime
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "pywin32>=308; sys_platform == 'win32'",

    # Testing / diagnostics are intentionally installed with the base
    # distribution so the installed build can self-test and self-repair.
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
tensorrt = [
    "tensorrt>=10.0.0",
    "tensorrt-llm>=0.15.0",
]

[project.scripts]
redsight = "redsight.cli:main"
redsight-server = "redsight.server:main"
redsight-ui = "redsight.ui:main"
redsight-index = "scripts.index:main"
redsight-benchmark = "scripts.benchmark:main"

[tool.setuptools.packages.find]
include = ["app*", "redsight*", "redsight_actions*", "ui*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "redsight", "redsight_actions", "ui"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["app", "redsight", "redsight_actions", "ui"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
